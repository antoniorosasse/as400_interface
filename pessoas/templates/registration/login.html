{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar - Sistema AS/400</title>
    <script>
    /* Mesmo tema do base.html: aplica antes do CSS para nao piscar. */
    (function () {
        var q = new URLSearchParams(window.location.search).get('tema');
        var t = (q === 'dark' || q === 'light') ? q : localStorage.getItem('sistema-tema');
        if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-bs-theme', t);
    })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'pessoas/css/sistema.css' %}?v=1">
</head>
<body>
<div class="container" style="max-width: 420px; margin-top: 8vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1"><i class="fas fa-database"></i> Sistema AS/400</h1>
            <p class="text-body-secondary small">Consulta de pessoas — acesso restrito</p>

            {% if form.errors %}
            <div class="alert alert-danger py-2 small mb-3">
                Usuário ou senha inválidos.
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuário</label>
                    <input type="text" name="username" id="id_username"
                           class="form-control" autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Senha</label>
                    <input type="password" name="password" id="id_password"
                           class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-right-to-bracket"></i> Entrar
                </button>
            </form>
        </div>
    </div>
    <p class="text-center text-body-secondary small mt-3">
        Uso restrito a pessoal autorizado.
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
