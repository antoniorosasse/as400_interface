{% extends "base.html" %}
{% block title %}Confirmar Exclusão{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirmar Exclusão</h5>
            </div>
            <div class="card-body">
                <p>Tem certeza que deseja excluir a pessoa <strong>{{ nome }}</strong> (ID {{ id_pessoa }})?</p>
                <p class="text-danger">Esta ação é irreversível!</p>
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next_url|default:'' }}">
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Confirmar Exclusão</button>
                    <a href="{% if next_url %}{{ next_url }}{% else %}{% url 'home' %}{% endif %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
