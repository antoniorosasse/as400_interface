<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEPs - IBM i</title>
    <!-- Bootstrap 5 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Opcional: ícones (para os botões) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Apenas um pequeno ajuste para espaçamento, sem interferir no Bootstrap */
        body {
            background-color: #f8f9fa;
        }
        .table-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .pagination .page-item.disabled .page-link {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container mt-4">

        <!-- Título -->
        <h1 class="display-5 mb-4 text-primary">
            <i class="bi bi-geo-alt"></i> Tabela de CEPs
        </h1>

        <!-- Barra de busca e botões -->
        <div class="row g-2 align-items-center mb-3">
            <div class="col-md-5 col-12">
                <div class="input-group">
                    <input type="text" id="cidadeInput" class="form-control" placeholder="Digite o nome da cidade..." aria-label="Buscar cidade">
                    <button id="searchBtn" class="btn btn-outline-primary" type="button">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <button id="clearBtn" class="btn btn-outline-secondary" type="button">
                        <i class="bi bi-eraser"></i> Limpar
                    </button>
                </div>
            </div>
            <div class="col-md-2 col-12">
                <button id="exportBtn" class="btn btn-success w-100" type="button">
                    <i class="bi bi-download"></i> Baixar CSV
                </button>
            </div>
            <div class="col-md-5 col-12 text-md-end text-muted small" id="info">
                Total de registros: 0
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2">Carregando dados...</p>
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <div class="table-responsive">
                <table id="table" class="table table-striped table-hover align-middle" style="display:none;">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>UF</th>
                            <th>Cidade</th>
                            <th>CEP De</th>
                            <th>CEP Até</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Preenchido pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Paginação -->
        <nav aria-label="Navegação de páginas" class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item" id="prevItem">
                    <button class="page-link" id="prevBtn" disabled>Anterior</button>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" id="pageInfo">Página 0 de 0</span>
                </li>
                <li class="page-item" id="nextItem">
                    <button class="page-link" id="nextBtn" disabled>Próximo</button>
                </li>
            </ul>
        </nav>

    </div>

    <!-- Bootstrap 5 (JS) - necessário apenas para funcionalidades como toggles, etc. (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ==================== SEU JAVASCRIPT (completo, inalterado) ==================== -->
    <script>
        let currentPage = 0;
        const pageSize = 10;
        let totalPages = 0;

        function loadPage(page) {
            const cidade = document.getElementById('cidadeInput').value.trim();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('table').style.display = 'none';

            let url = `/ceps/page?page=${page}&size=${pageSize}`;
            if (cidade !== '') {
                url += `&cidade=${encodeURIComponent(cidade)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.error) {
                        alert('Erro: ' + data.error);
                        return;
                    }

                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';
                    data.content.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${item.id}</td>
                            <td>${item.uf}</td>
                            <td>${item.cidade}</td>
                            <td>${item.cepDe}</td>
                            <td>${item.cepAte}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('table').style.display = 'table';

                    totalPages = data.totalPages;
                    currentPage = data.page;

                    document.getElementById('pageInfo').textContent = `Página ${currentPage + 1} de ${totalPages}`;
                    document.getElementById('info').innerHTML = `<i class="bi bi-database"></i> Total de registros: ${data.totalElements}`;

                    document.getElementById('prevBtn').disabled = (currentPage === 0);
                    document.getElementById('nextBtn').disabled = (currentPage >= totalPages - 1);
                    // Atualiza os itens da paginação para desabilitar visualmente também
                    document.getElementById('prevItem').classList.toggle('disabled', currentPage === 0);
                    document.getElementById('nextItem').classList.toggle('disabled', currentPage >= totalPages - 1);
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    alert('Erro ao carregar dados: ' + err.message);
                });
        }

        // Eventos
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 0) loadPage(currentPage - 1);
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < totalPages - 1) loadPage(currentPage + 1);
        });
        document.getElementById('searchBtn').addEventListener('click', () => {
            loadPage(0);
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('cidadeInput').value = '';
            loadPage(0);
        });
        document.getElementById('cidadeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadPage(0);
            }
        });

        // Exportação CSV
        document.getElementById('exportBtn').addEventListener('click', function() {
            const cidade = document.getElementById('cidadeInput').value.trim();
            let url = '/ceps/export';
            if (cidade !== '') {
                url += '?cidade=' + encodeURIComponent(cidade);
            }
            window.location.href = url;
        });

        // Carregar primeira página ao iniciar
        loadPage(0);
    </script>

</body>
</html>
