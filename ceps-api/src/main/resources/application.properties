# Conexão com o IBM i
spring.datasource.url=jdbc:as400://pub400.com;libraries=AROSASSE1;naming=sql
spring.datasource.username=AROSASSE
spring.datasource.password=REDACTED
spring.datasource.driver-class-name=com.ibm.as400.access.AS400JDBCDriver

# Configuração do Hikari (pool de conexões)
spring.datasource.hikari.connection-test-query=SELECT 1 FROM SYSIBM.SYSDUMMY1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Porta da aplicação
server.port=8080